name: Build and Deploy

on:
  push:
    branches:
      - main  # main 브랜치에 푸시할 때 실행
  workflow_dispatch:  # 수동 실행 가능

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read  # GitHub Packages 에서 nklcbdty-common 다운로드용

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '17'  # JDK 버전 설정
          distribution: 'adopt'  # JDK 배포판

      - name: Make gradlew executable
        run: chmod +x ./gradlew  # gradlew에 실행 권한 부여

      # 테스트를 안 돌리던 시절엔 nklcbdty-common 의 수정이 반영 안 된 채(옛 버전 pin)
      # 배포돼도 아무도 몰랐다. 자격증명이 필요한 @SpringBootTest 는 스스로 skip 되므로
      # 여기서 도는 건 DB/네트워크 없이 끝나는 단위 테스트뿐이다.
      - name: Build with Gradle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean test bootJar
        working-directory: ./  # 루트 디렉토리로 설정

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg GITHUB_ACTOR=${{ github.actor }} \
            --build-arg GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -t ejy1024/nklcbdty-service:latest .

      - name: Push Docker image
        run: |
          docker push ejy1024/nklcbdty-service:latest

  # 클라우드타입 자동 재배포.
  #
  # 기본적으로 건너뛴다. 아래 변수/시크릿을 설정해야 비로소 동작한다:
  #   vars.CLOUDTYPE_PROJECT    "스페이스명/프로젝트명" (예: backend1024/server)
  #   vars.CLOUDTYPE_STAGE      배포환경 이름 (예: main)
  #   secrets.CLOUDTYPE_TOKEN   스페이스 설정 > 인증 > 새로운 API 키 생성
  #   secrets.CLOUDTYPE_APP_YAML  서비스 상세 > CLI 탭의 YAML 전체
  #
  # app.yaml 을 파일이 아니라 시크릿으로 받는 이유:
  # 이 저장소는 PUBLIC 이고 배포 설정에는 DATASOURCE_URL 등 env 값이 들어간다.
  # 파일로 커밋하면 접속정보가 그대로 공개된다.
  deploy:
    name: Deploy to Cloudtype
    needs: build
    if: vars.CLOUDTYPE_PROJECT != ''
    runs-on: ubuntu-latest

    steps:
      - name: Redeploy on Cloudtype
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          project: ${{ vars.CLOUDTYPE_PROJECT }}
          stage: ${{ vars.CLOUDTYPE_STAGE }}
          yaml: ${{ secrets.CLOUDTYPE_APP_YAML }}

  # 재배포가 "성공"으로 끝나도 실제로 새 코드가 떴는지는 별개다.
  # (임베딩 모델 로딩이 기동을 죽여 옛 컨테이너가 6주간 서비스된 적이 있다)
  # 빈 본문 회원가입 요청으로 확인한다:
  #   400 = 컨트롤러까지 도달(= AllowedPaths 반영된 새 빌드)
  #   401 = AuthFilter 에서 잘림(= 옛 빌드가 그대로)
  # deploy 를 건너뛰면(수동 배포 중이면) 이 잡도 함께 건너뛴다.
  verify:
    name: 배포 반영 확인
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Smoke test /api/auth/signup
        env:
          API_BASE: ${{ vars.API_BASE_URL || 'https://port-0-nklcbdty-service-m6qh1fte0c037b76.sel4.cloudtype.app' }}
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              -X POST "$API_BASE/api/auth/signup" \
              -H 'Content-Type: application/json' \
              -d '{"email":"","password":"","nickname":""}' || echo 000)
            echo "시도 $i/30 → HTTP $code"
            if [ "$code" = "400" ]; then
              echo "새 빌드 반영 확인됨"
              exit 0
            fi
            sleep 10
          done
          echo "::error::5분 동안 새 빌드가 뜨지 않았습니다(마지막 응답 HTTP $code). 클라우드타입 콘솔을 확인하세요."
          exit 1
