name: Build and Deploy

on:
  push:
    branches:
      - main  # main 브랜치에 푸시할 때 실행
  workflow_dispatch:  # 수동 실행 가능

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read  # GitHub Packages 에서 nklcbdty-common 다운로드용

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: '17'  # JDK 버전 설정
          distribution: 'adopt'  # JDK 배포판

      - name: Make gradlew executable
        run: chmod +x ./gradlew  # gradlew에 실행 권한 부여

      - name: Build with Gradle(without tests)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean bootJar
        working-directory: ./  # 루트 디렉토리로 설정

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg GITHUB_ACTOR=${{ github.actor }} \
            --build-arg GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -t ejy1024/nklcbdty-service:latest .

      - name: Push Docker image
        run: |
          docker push ejy1024/nklcbdty-service:latest

  # 이미지를 Docker Hub 에 올리는 것만으로는 운영 서버가 바뀌지 않는다.
  # (이 단계가 없어서 6월 19일자 빌드가 8월까지 그대로 떠 있었다)
  # 클라우드타입 인스턴스에 새 이미지를 다시 내려받게 만든다.
  deploy:
    name: Deploy to Cloudtype
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Redeploy on Cloudtype
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}  # 스페이스 설정 > 인증 > 새로운 API 키 생성
          project: ${{ vars.CLOUDTYPE_PROJECT }}  # "스페이스명/프로젝트명" 형식
          stage: ${{ vars.CLOUDTYPE_STAGE }}
          file: .cloudtype/app.yaml

  # 재배포가 "성공"으로 끝나도 실제로 새 코드가 떴는지는 별개다.
  # 빈 본문 회원가입 요청으로 확인한다:
  #   400 = 컨트롤러까지 도달(= AllowedPaths 반영된 새 빌드)
  #   401 = AuthFilter 에서 잘림(= 옛 빌드가 그대로)
  verify:
    name: 배포 반영 확인
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Smoke test /api/auth/signup
        env:
          API_BASE: ${{ vars.API_BASE_URL || 'https://port-0-nklcbdty-service-m6qh1fte0c037b76.sel4.cloudtype.app' }}
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              -X POST "$API_BASE/api/auth/signup" \
              -H 'Content-Type: application/json' \
              -d '{"email":"","password":"","nickname":""}' || echo 000)
            echo "시도 $i/30 → HTTP $code"
            if [ "$code" = "400" ]; then
              echo "새 빌드 반영 확인됨"
              exit 0
            fi
            sleep 10
          done
          echo "::error::5분 동안 새 빌드가 뜨지 않았습니다(마지막 응답 HTTP $code). 클라우드타입 콘솔을 확인하세요."
          exit 1
