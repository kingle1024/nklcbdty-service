name: Mail Health

# 아침 구독 메일이 나갈 수 있는 상태인지 매일 먼저 확인한다.
#
# 2026-11 에 아침 메일이 안 왔는데 batch 기록(BATCH_JOB_EXECUTION)은 매일 COMPLETED,
# write_count=1 이었다. 실제로는 batch 의 Gmail SMTP 로그인이 막혀 있었고
# (`/actuator/health/mail` = 503), EmailService 가 발송 예외를 삼켜서 아무도 몰랐다.
# 거기에 batch 컨테이너가 아예 안 떠 있어 작업 기록이 0건인 날도 섞여 있었다.
#
# batch 코드는 고쳐도 CloudType 이 새 이미지를 늦게(혹은 안) 반영하므로, 앱 바깥인 여기서 본다.
# 실패하면 이 워크플로가 빨간불이 되고 GitHub 가 실패 알림 메일을 보낸다
# (그 메일은 GitHub 가 보내므로 우리 SMTP 가 죽어 있어도 온다).
#
# 메일 health 가 DOWN 일 때 고치는 법: Google 계정에서 앱 비밀번호를 새로 발급해
# CloudType batch(그리고 service) 앱의 MAIL_PASSWORD 환경변수에 넣고 콘솔에서 재배포한다.
# Google 은 계정 비밀번호를 바꾸거나 2단계 인증을 껐다 켜면 앱 비밀번호를 전부 폐기한다.

on:
  schedule:
    # UTC 22:40 = KST 07:40. 메일(08:00, 실제로는 링크검증 뒤 08:2x)보다 먼저 알기 위해.
    - cron: '40 22 * * *'
  workflow_dispatch:

jobs:
  check:
    name: batch 메일 발송 가능 여부
    runs-on: ubuntu-latest

    steps:
      - name: batch 컨테이너가 떠 있는가
        env:
          BATCH_BASE: ${{ vars.BATCH_BASE_URL || 'https://port-0-nklcbdty-batch-m6qh1fte0c037b76.sel4.cloudtype.app' }}
        run: |
          # scheduledtasks 는 인증 없이 열려 있고 스케줄러가 등록돼 있어야 200 + cron 목록을 준다.
          body=$(curl -s --max-time 60 "$BATCH_BASE/actuator/scheduledtasks" || echo "")
          if ! printf '%s' "$body" | grep -q 'EmailBatchScheduler'; then
            echo "::error::batch 컨테이너가 응답하지 않습니다 — 오늘 아침 메일·크롤이 안 돕니다. CloudType 콘솔에서 batch 앱 상태를 확인하세요. 응답: $(printf '%s' "$body" | head -c 200)"
            echo "### ❌ batch 컨테이너 응답 없음" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "batch 스케줄러 등록 확인"

      - name: SMTP(Gmail) 로그인이 되는가
        env:
          BATCH_BASE: ${{ vars.BATCH_BASE_URL || 'https://port-0-nklcbdty-batch-m6qh1fte0c037b76.sel4.cloudtype.app' }}
        run: |
          # Spring Boot 의 메일 health 는 SMTP 에 실제로 접속·인증해 본다. 200=UP, 503=DOWN.
          # CloudType 이 5xx 본문을 자기 에러 페이지로 바꾸므로 상태 코드만 본다.
          code=$(curl -s -o /dev/null --max-time 60 -w '%{http_code}' "$BATCH_BASE/actuator/health/mail" || echo "000")
          echo "health/mail: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::batch 의 Gmail SMTP 연결이 실패합니다(health/mail=$code). 오늘 아침 메일은 기록상 '성공'이어도 실제로는 안 나갑니다. 앱 비밀번호를 재발급해 CloudType 의 MAIL_PASSWORD 를 갱신하고 재배포하세요."
            {
              echo "### ❌ 메일 발송 불가 (health/mail=$code)"
              echo ""
              echo "1. Google 계정 → 보안 → 앱 비밀번호에서 새로 발급 (16자, 공백 없이)"
              echo "2. CloudType batch·service 앱의 \`MAIL_PASSWORD\` 에 넣기"
              echo "3. 콘솔에서 재배포 후 이 워크플로를 수동 실행해 초록인지 확인"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### ✅ batch 메일 health UP" >> "$GITHUB_STEP_SUMMARY"
