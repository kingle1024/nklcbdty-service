# 클라우드타입 배포 설정 (.github/workflows/docker-publish.yml 의 deploy 잡이 읽는다)
#
# ⚠️ 아래 내용은 자리표시자다. 그대로 두면 배포가 실패한다.
#    클라우드타입 콘솔 > 해당 서비스 상세 > "CLI" 탭에 이 서비스 전용 YAML 이
#    그대로 나와 있으니, 복사해서 이 파일 전체를 덮어써야 한다.
#    (서비스마다 app/options 필드가 달라서 손으로 짐작해 쓰면 안 된다)
#
# 참고: https://docs.cloudtype.io/guide/cicd/github-actions
#
# 우리 서비스는 소스가 아니라 Docker Hub 에 올라간 이미지를 받아 뜨는 구조이므로,
# CLI 탭에서 복사한 YAML 의 이미지 태그가 아래와 같은지 확인한다.
#   ejy1024/nklcbdty-service:latest
#
# 같은 태그(latest)를 계속 쓰기 때문에 배포 설정 자체는 매번 동일하다.
# 이 잡의 역할은 "인스턴스가 latest 를 다시 내려받게 만드는 것"이다.

name: nklcbdty-service
app: container
options:
  image: ejy1024/nklcbdty-service:latest
  ports: "8080"  # Dockerfile 의 EXPOSE 와 동일
