# 클라우드타입 배포 설정 (.github/workflows/docker-publish.yml 의 deploy 잡이 읽는다)
#
# ⚠️ 아래 내용은 자리표시자다. 반드시 콘솔에서 복사한 내용으로 덮어써야 한다.
#
#    클라우드타입 콘솔 > 서비스 상세 > "CLI" 탭 에 이 서비스 전용 YAML 이
#    그대로 나와 있다. 그걸 복사해서 이 파일 전체를 교체한다.
#    https://app.cloudtype.io/@backend1024/server:main/nklcbdty-service#cli
#
# ⚠️ 특히 env(환경변수) 를 빠뜨리면 안 된다.
#    이 서비스는 DATASOURCE_URL, REDIS_HOST, PROFILE, GEMINI_API_URL,
#    GITHUB_ACTOR/GITHUB_TOKEN 등을 콘솔에 설정해두고 쓴다.
#    env 가 빠진 설정으로 배포하면 콘솔의 환경변수 설정을 덮어써서
#    서버가 뜨지 못할 수 있다. CLI 탭 내용을 그대로 쓰면 이 문제가 없다.
#
# 참고: https://docs.cloudtype.io/guide/cicd/github-actions
#
# 이 서비스는 Docker Hub 이미지를 받아 뜨는 게 아니라
# GitHub 저장소의 Dockerfile 을 클라우드타입이 직접 빌드하는 구조다.
# (콘솔 설정에 Dockerfile path / Build arguments 가 있는 이유)
# 따라서 app.yaml 도 이미지 지정이 아니라 git context + Dockerfile 형태여야 한다.

name: nklcbdty-service
app: dockerfile
options:
  ports: 8080          # Dockerfile 의 EXPOSE 와 동일
  dockerfile: Dockerfile
  # env: 콘솔 CLI 탭에서 복사한 환경변수 목록을 여기에 그대로 넣는다
context:
  git:
    ref: ${{ github.ref }}
    url: git@github.com:${{ github.repository }}.git
